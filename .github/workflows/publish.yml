name: Sync and Generate Font
on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: Force a release even without upstream changes
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 1,15 * *"

permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check:
    name: Validate tool and check upstream
    runs-on: ubuntu-latest
    outputs:
      update_available: ${{ steps.check.outputs.update_available }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get --enforce-lockfile
        working-directory: tool
      - run: dart analyze
        working-directory: tool
      - run: dart test
        working-directory: tool
      - name: Check for updates
        id: check
        working-directory: tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run bin/pixelarticons_tool.dart --project-root .. --dry-run

  build-and-tag:
    name: Generate and tag release
    needs: check
    if: ${{ needs.check.outputs.update_available == 'true' || inputs.force_publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TAG_PAT }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
        working-directory: tool
      - name: Sync icons and generate package artifacts
        working-directory: tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force_publish }}
        run: |
          if [ "$FORCE_RELEASE" = "true" ]; then
            dart run bin/pixelarticons_tool.dart --project-root .. --force-release
          else
            dart run bin/pixelarticons_tool.dart --project-root ..
          fi
      - name: Validate generated package
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit and tag generated artifacts
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml CHANGELOG.md lib/pixel.dart fonts/pixelarticons.otf
          git commit -m 'Automatic sync with pixelarticons upstream'
          git tag "v$VERSION"
          git push origin HEAD
          git push origin "v$VERSION"
