name: Update icons and publish release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,15 * *"

permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  check:
    name: Validate tool and check upstream
    runs-on: ubuntu-latest
    outputs:
      update_available: ${{ steps.check.outputs.update_available }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release token
        env:
          TAG_PAT: ${{ secrets.TAG_PAT }}
        run: |
          if [ -z "$TAG_PAT" ]; then
            echo '::error::Configure TAG_PAT with repository contents write access so the release tag can trigger pub.dev publishing.'
            exit 1
          fi
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get --enforce-lockfile
        working-directory: tool
      - run: dart analyze
        working-directory: tool
      - run: dart test
        working-directory: tool
      - name: Check for updates
        id: check
        working-directory: tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run bin/pixelarticons_tool.dart --project-root .. --dry-run

  build-and-tag:
    name: Generate and tag release
    needs: check
    if: ${{ needs.check.outputs.update_available == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TAG_PAT }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
        working-directory: tool
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/package-lock.json
      - run: npm ci
        working-directory: tool
      - run: npm test
        working-directory: tool
      - name: Sync icons and generate package artifacts
        working-directory: tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_RELEASE" = "true" ]; then
            dart run bin/pixelarticons_tool.dart --project-root .. --force-release
          else
            dart run bin/pixelarticons_tool.dart --project-root ..
          fi
      - name: Validate generated package
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit and tag generated artifacts
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml CHANGELOG.md lib/pixel.dart fonts/
          git commit -m 'Automatic sync with pixelarticons upstream'
          git tag "v$VERSION"
          git push --atomic origin HEAD "refs/tags/v$VERSION"
          echo "### Release v$VERSION queued for publishing" >> "$GITHUB_STEP_SUMMARY"
          echo "Icons were checked, artifacts generated, tests passed, and the release tag pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "Follow the [Publish package to pub.dev workflow](https://github.com/${{ github.repository }}/actions/workflows/publish-pubdev.yml) for the publishing result." >> "$GITHUB_STEP_SUMMARY"
