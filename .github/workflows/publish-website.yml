name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build website for the Pages URL
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --base-href "${PAGES_BASE_PATH}/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
