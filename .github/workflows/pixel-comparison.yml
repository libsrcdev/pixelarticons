name: Compare SVGs and font grid
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get --enforce-lockfile
        working-directory: tool
      - name: Download pinned source SVGs
        run: dart run bin/download_test_sources.dart
        working-directory: tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compare every pixel art grid cell
        run: dart run rps pixels
      - name: Save visual report and difference images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-pixel-comparison
          path: build/icon-comparison/
          if-no-files-found: warn
